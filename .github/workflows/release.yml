name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Hosted runners do not populate the user's Send To shortcuts. Run the
      # InteractiveShell test on a Windows desktop before publishing a release.
      - name: Restore and run noninteractive tests
        run: dotnet test tests/IntraDrop.Tests/IntraDrop.Tests.csproj -c Release --filter "Category!=InteractiveShell"

      - name: Publish Windows 10/11 build (net8, self-contained single file)
        run: >
          dotnet publish src/IntraDrop/IntraDrop.csproj
          -c Release -f net8.0-windows -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Publish Windows 7 build (net48, AnyCPU)
        run: dotnet publish src/IntraDrop/IntraDrop.csproj -c Release -f net48

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build Windows 10/11 installer
        run: iscc installer/IntraDrop.iss

      - name: Build Windows 7 installer
        run: iscc installer/IntraDrop-Win7.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installer/Output/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
